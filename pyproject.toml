[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cot-control-inspect"
version = "0.1.0"
description = "Placeholder for a CoT-Control QA port to Inspect AI"
requires-python = ">=3.11"
dependencies = ["inspect_ai"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["cot_control"]
