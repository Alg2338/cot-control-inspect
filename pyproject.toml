[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cot-control-inspect"
version = "0.1.0"
description = "An Inspect AI port of the CoT-Control QA evaluation (work in progress)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "inspect_ai>=0.3",
    "datasets>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cot_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
