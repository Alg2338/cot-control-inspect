[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cot-control-qa-inspect"
version = "0.1.0"
description = "QA-only CoTControl port to Inspect AI (placeholder)"
requires-python = ">=3.11"
dependencies = ["inspect_ai"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["cot_control_qa"]
